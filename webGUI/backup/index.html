<html>
    <head>
        <!--<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">-->
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
/* -------------------------------
   0) Polices OKI
----------------------------------*/
@font-face {
  font-family: fontInterval;
  src: url(interval.ttf);
}
@font-face {
  font-family: fontUser;
  src: url(user.ttf);
}

/* -------------------------------
   1) Variables de thème
----------------------------------*/
:root {
  /* Échelles & bases */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 12px;

  --shadow-soft: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 40px rgba(0, 0, 0, 0.5) inset;
  --shadow-emboss: inset 4px 4px 8px rgba(0, 0, 0, 0.7), inset -4px -4px 4px rgba(140, 140, 140, 0.7);
  --shadow-press: inset 4px 4px 8px rgba(140, 140, 140, 0.7), inset -4px -4px 4px rgba(0, 0, 0, 0.7);

  --border-emboss-top: 1px solid silver;
  --border-emboss-bottom: 1px solid black;
  --border-emboss-left: 1px solid grey;
  --border-emboss-right: 1px solid black;


  /* États */
  --ok: lime;
  --warn: yellow;
  --danger: red;
  --info: #3498db;
  --pending: #2196f3;
  --accent-strong: #AAFF00; /* vert flashy utilisé */
  
  --lightOn: yellow;
  --lightOn-2: #f1e46a;
  --lightOn-3: #fff280;
   
}

/* --------- Thème sombre (par défaut) --------- */
:root[data-theme="dark"] {
  --bg: #384047;
  --bg-2: #545454;
  --bg-3: #696969;
  --bg-4: #777777;
  --panel-grad: linear-gradient(#545454, #8a8a8a, #7f7a7a);
  --panel-grad-2: linear-gradient(355deg, #545454, #545454, #8a8a8a, #696969);
  --steel-grad: linear-gradient(#474747, #7f7a7a);
  --steel-grad-2: linear-gradient(135deg, #d7d7d7 0%, #a8a8a8 40%, #f0f0f0 60%, #999 100%);
  --content-grad: linear-gradient(200deg, #666666, #888888,#888888,#888888, #878787, #676767,#777777);

  --text: #ffffff;
  --text-dim: rgba(255,255,255,0.6);
  --muted: #aaaa77;

  --brand: #1c4063; /* bleu pétrole signature */
  --brand-2: #004477; /* reflets internes */
  --brand-3: #001177; /* pour LCD */
  --brand-4: #0a1a88;

  --lightOn-2: #fff066;
  --lightOn-3: #fff280;

  --border: #ddd;

  --tooltip-bg: rgba(255, 255, 255, 0.5);
  --tooltip-text: #000;

  --input-bg: #1c4063;
  --input-text: #fff;
  --input-border: #fff;

  --lcd-bg-top: var(--brand-4);
  --lcd-bg-bottom: var(--brand-3);
  --lcd-inner-glow: var(--brand-2);
  --lcd-outer-glow: #00ffff55;

  --connectbar-red: radial-gradient(circle, red 20%, transparent 50%);
  --connectbar-green: radial-gradient(circle, var(--accent-strong), transparent 50%);
  --connectbar-blue: radial-gradient(circle, #2196f3, transparent 50%);

  --bar-bg: #f1f1f1;
  --bar-fill: var(--brand);

  --bank-shadow: var(--shadow-soft);
  --accordion-color: #cccccc;

  --menu-bg: #f7fafc;
  --menu-border: var(--info);
  --menu-divider: #cbd5e0;

  --switch-bg: var(--brand);
  --switch-thumb: #fff;

  --textOutline: green;
  --hallow: lime;
  
  --dash-light: rgba(255, 255, 255, 0.25);
  --dash-strong: rgba(255, 255, 255, 0.35);   

}



/* --------- Thème clair --------- */
:root[data-theme="light"] {
  --bg: #f4f6f8;
  --bg-2: #e9eef3;
  --bg-3: #dae2ea;
  --bg-4: #cbd8e3;
  --panel-grad: linear-gradient(#e9eef3, #dae2ea, #cbd8e3);
  --panel-grad-2: linear-gradient(355deg, #e9eef3, #e9eef3, #dae2ea, #cbd8e3);
  --steel-grad: linear-gradient(#d6dbe0, #c2c9d0);
  --steel-grad-2: linear-gradient(135deg, #d6dbe0 0%,#cbd8e3 40%, #f0f4f8 60%, #c2c9d0 100%);  
  --content-grad: linear-gradient(200deg, #e7edf3, #f0f4f8,#f0f4f8,#f0f4f8, #e9eef3, #e3eaf1,#eef3f8);

  --text: #000000;
  --text-dim: rgba(0,0,0,0.6);
  --muted: #444;

  --brand: #2a5c84;
  --brand-2: #2b6ca3;
  --brand-3: #0d2b7a;
  --brand-4: #2c48a3;

  --border: #9aa7b3;


  --tooltip-bg: rgba(0,0,0,0.75);
  --tooltip-text: #fff;

  --input-bg: #e9eef3;
  --input-text: #1a1f24;
  --input-border: #2a5c84;

  --lcd-bg-top: #6b8cff;
  --lcd-bg-bottom: #4160d6;
  --lcd-inner-glow: #4a86c5;
  --lcd-outer-glow: rgba(0, 120, 255, 0.33);
  
  --connectbar-red: radial-gradient(circle, #d64545 20%, transparent 50%);
  --connectbar-green: radial-gradient(circle, #79d645, transparent 50%);
  --connectbar-blue: radial-gradient(circle, #4b7bd6, transparent 50%);

  --bar-bg: #dfe6ec;
  --bar-fill: #2a5c84;

  --bank-shadow: 0 0 5px rgba(0,0,0,0.08), 0 0 40px rgba(0, 0, 0, 0.08) inset;
  --accordion-color: #1a1f24;

  --menu-bg: #ffffff;
  --menu-border: #2a5c84;
  --menu-divider: #e5e7eb;

  --switch-bg: #cfd9e3;
  --switch-thumb: #fff;

  --textOutline: black;
  --hallow: black;  
  
  --dash-light: rgba(0, 0, 0, 0.25);
  --dash-strong: rgba(0, 0, 0, 0.35);   
  
}

/* -------------------------------
   2) Base / Reset
----------------------------------*/
* { box-sizing: border-box; }
html { font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
body {
  background-color: var(--bg);
  color: var(--text);
  font-size: 14px;
  margin: 0;
}
.center { margin-left: auto; margin-right: auto; }
h8 { font-family: fontInterval; }

/* Icon fonts */
.iconUser { font-family: fontUser; }
.iconInterval, .interfaceIcon { font-family: fontInterval; }

/* Éléments formulaires */
input, select, button {
  background-color: var(--bar-bg);
  border-radius: var(--radius-xs);
  vertical-align: middle;
  text-align: center;
  font: inherit;
}

input, select, .skelName, .stripProperty {
  background: var(--input-bg);
  border: 2px solid var(--input-border);
  color: var(--input-text);
  padding: 1px 4px;
  border-radius: var(--radius-xs);
}

select option { background: #a9a9a9; color: #000; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; pointer-events: none; opacity: .55; }
button:active { transform: scale(0.97); box-shadow: 3px 2px 22px 1px rgba(1, 0, 0, 0.24); }

/* --- Table boutons: verticalLines / forceColumn / forceRow (restauré) --- */
.verticalLines {
  text-align: center;
  color: black;
  font-size: 1em;
  margin: 0 auto;
  border-collapse: separate;
  border: 2px solid Silver;
  border-radius: 10px;
}
.verticalLines td {
  padding: 5px 5px 0;
  background-color: #ffffff;
}
.verticalLines tr:first-child td {
  background: LightGrey;
}

/* Option actuellement configurée */
option.current-wifi {
  color: #1da81d;
  font-weight: bold;
}

/* Liens top bar */
#indexTopBar {
  position: fixed; top: 0; width: 99%; transition: top 0.3s; z-index: 1000; 
}

/* États / Badges */
.offline::after { content: "❌"; }

/* i18n indicateur 
i18n::after {
    content: '⚆';
    position: absolute; animation: light 1s infinite;
}
.clear-animation::after { animation: none; content: ''; }
*/

.clear-animation::after { animation: none; }

i18n {
  border-radius: 5px;
  position: relative;
  display: inline-block;
  overflow: hidden;
}

i18n::after {
  content: "";
  position: absolute;
  top: 0; left: -75%;
  width: 50%;height: 100%;
  background: linear-gradient(120deg,
      transparent 0%,
      rgba(255,255,255,0.6) 50%,
      transparent 100%);
  animation: reflectMove 1.5s infinite;
}

@keyframes reflectMove {
  100% { left: 125%; }
}

/* Boutons spécifiques */
.property {
  background: var(--brand);
  border-radius: 30%;
  border: 2px solid var(--input-border);
  color: var(--text); padding: 4px;
  /* 3 colonnes max 
  flex: 1 1 calc(33.333% - 10px); */
}

/* properties des interfaces */
.IFproperties {
  display: block;
}

input, select, .skelName, .stripProperty { width: 80%; }

/* -------------------------------
   3) Responsive
----------------------------------*/
/* Mobile */
@media only screen and (max-device-width: 730px) {
    #libContainer, .tabs, #logContainer { display: none; }
    .bigIcon { font-size: 15vw; }
    #bankNavigator { display: grid; grid-template-columns: repeat(2, 1fr); height: 180px; }
    .fsl-accordion-container, .bankName, .lbl-toggle { font-size: 7vw; }
    .interfaceIcon { font-size: 10vw; }
    .interfaceName { font-size: 0; }
    .stripMask { font-size: 3vw; }
    .tab, input, select, button { font-size: 4vw;}
    .navBut {margin-left: 10px; padding-left:10px; font-size: 3vmax}
    .addButton, .closeStripButton, .property, .charPopupButton, .bankIcon, .bankCopy { font-size: 3vmax; }
    .trash-icon, .move-icon, .config-icon, .copy-icon { font-size: 4vmax; }
    .copy-icon { left: 6vw; }
    .grid-item { border: 2px dashed var(--dash-strong); }
    .help::before { font-size: 3vh; }
    .twoColumn { /* défini en desktop media query */ }
    .dropdown input { margin-top:5%; width : 70%; border: 0; margin-left:2px}
    .bankName {font-size:2.5vw;  width: 99%; margin-left: 10px}
    .widgetMask { font-size: 3vw; }
    .interfaceCfgContent { font-size:3.5vw}
    .led {    width: 7vmin; height: 7vmin;  }
    .mobileMenuOn {display: flex;}
    .menuItem, .menuItemClose, .menuItemTitle {font-size: 8vmin; }
    .wizBtn{font-size:10vmin;}
    .widgetLabel {max-width: 25vw;}
    #flexibleGridZone {height: max(60vh, 60vw);}
    .popup-box{font-size: 3vmax;}
    #waitingDiv {width: 70%;left: 15%}
    #waitingMsg, #waitingDiv .iconInterval {font-size: 5vmax;transform: translate(0, 20%)}
    #waitingMsg{transform: translate(0, -30%)}
}

/* Desktop */
@media only screen and (min-device-width: 731px) {
    .interfaceCfgContent { font-size:1vw}
    .bigIcon { font-size: 10vw; }
    .stripMask, .tooltip .tooltiptext { font-size: 1vw; }
    .closeStripButton, .property, .charPopupButton, .fsl-accordion-container, .trash-icon, .move-icon, .config-icon, .copy-icon, .bankIcon, .bankCopy,    .bankName { font-size: 1.5vmax; }
    #bankNavigator{display: flex;height: 64px;}
    .tab { font-size: 2.5vw; }
    .copy-icon { left: 2.5vw; }
    input, select, button { font-size: 1.5vw; height: 3vw; }
    .grid-item { border: 1px dashed var(--dash-light); }
    .twoColumn { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .help::before { font-size: 1vw; }
    .widgetMask, .lbl-toggle { font-size: 1.5vw; }
    .dropdown input { width : 85%; margin-left:1px}
    .widgetLabel {max-width: 6vw; font-size:1vw;}
    .led {    width: 4vmin; height: 4vmin;  }
    .mobileMenuOn {display: none;}
    .menuItem, .menuItemClose, .menuItemTitle {font-size: 3vmin; }
    .wizBtn{font-size:6vmin;}
    /*.bank {justify-content: space-evenly;}*/
    #flexibleGridZone {height: max(30vh, 30vw);}
    .stripProperty, .skelName {font-size: 1vw;}
    .popup-box{font-size: 2vmax;}
    #waitingDiv {width: 20%; left: 40%}
    #waitingMsg, #waitingDiv .iconInterval {font-size: 2vmax;transform: translate(0, 20%)} 
    #waitingMsg{transform: translate(0, -50%)}
    
}

/* -------------------------------
   4) Composants
----------------------------------*/
/* États visuels divers */
.greyedout { opacity: .3; filter: grayscale(30%); filter: gray; cursor: pointer; }

/* CSS POPUP MESSAGE */
/* Overlay */
.popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    opacity: 0;
    transition: opacity 0.25s ease;
}

/* Boîte */
.popup-box {
    background: var(--bg);
    padding: 25px;
    border: 1px solid var(--text);
    border-radius: 12px;
    width: 50%;
    max-width: 90%;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.25s ease;
    font-family: Arial, sans-serif;

}

.popup-box p {
    margin-bottom: 20px;
}

/* Boutons */
.popup-btn {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    color: white;
    height: fit-content;
}

/* Couleurs alternées */
.popup-btn:nth-child(odd) {
    background: #2196F3;
}

.popup-btn:nth-child(odd):hover {
    background: #1e88e5;
}

.popup-btn:nth-child(even) {
    background: #4CAF50;
}

.popup-btn:nth-child(even):hover {
    background: #43a047;
}




.uniqueID {
    border-radius: 5px;
}

.navBut{width:8%; background: Gainsboro;}

.wizBtn{height:fit-content; padding: 0; background-color: transparent; border: 0}
.btnLeft{float: left}
.btnRight{float: right}

/* LCD SCREEN */
.lcdScreen,
.content-inner.lcdScreen {
  background: linear-gradient(to bottom, var(--lcd-bg-top) 0%, var(--lcd-bg-bottom) 100%);
  border-radius: 5px;
  font-family: "Courier New", monospace;
  letter-spacing: 2px;
  padding: 2px;
  text-align: center;
  position: relative;
  box-shadow: inset 0 0 20px var(--lcd-inner-glow), 0 0 15px var(--lcd-outer-glow);
  text-transform: uppercase;
  text-shadow:
    0 0 2px #0f0,
    1px 0 0 rgba(255,0,0,.4),
   -1px 0 0 rgba(0,120,255,.4);
  animation: crtJitter 0.12s infinite;
  filter: blur(0.3px);
}

.lcdScreen::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 40%;
  border-radius: 8px 8px 0 0;
  background: linear-gradient(to bottom, rgba(0,255,0,0.25), rgba(255,0,0,0));
  pointer-events: none;
}
.cursor { display: inline-block; animation: blink 1s steps(1) infinite; vertical-align: bottom; }

/* --- EDITEUR SYSEX (restauré) --- */
.entry {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
}
.entry input {
  margin-right: 5px;
  padding: 5px;
}
.entry textarea {
  font-size: 1.5vw;
  min-width: 80%;
  height: 4.5vh;
  min-height: 4.5vh;
  max-height: 11.5vh;
}
.entry button {
  margin-left: 5px;
  cursor: pointer;
}
#entries { margin-bottom: 10px; }

#waitingDiv, .centeredDiv, #waitingMsg{
  display: flex; 
  justify-content: center; 
  align-items: center;      
}


/* Loader + Waiting */
#waitingDiv {
  position: fixed; top: 45%; padding: 1%; z-index: 9999;
  background: radial-gradient(circle, var(--lightOn) 2%, transparent 80%) left/30% 10% no-repeat var(--bg-4);
  animation: l1 1s infinite ease-in-out;
  border-radius: 30px;
  box-shadow: 0 0 0 var(--lightOn), 0 0 4px var(--lightOn), 0 0 8px var(--lightOn-2), 0 0 16px var(--lightOn-3), 0 0 150px 150px rgba(0, 0, 0, 0.7); /* contour noir d’environ 15px */
  border: 2px solid var(--text);
  z-index: 9999;  
  color: var(--text);  
}
#waitingMsg { text-align: center; margin: 1%;  padding:2%;}

/* Switch ON/OFF */
.switch {
  position: relative; display: inline-block; width: 7.9vmin; height: 5vmin;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  text-align: center; font-size: 10px; vertical-align: middle;
}
.switch input { display: none; }
.slider {
  position: absolute; cursor: pointer; inset: 0; background-color: var(--switch-bg); transition: .4s; border-radius: var(--radius-sm); font-size: 2vmin;
}
.slider:before {
  content: ""; position: absolute; width: 4vmin; top: 1px; left: 1px; right: 1px; bottom: 1px; background-color: var(--switch-thumb); transition: .4s; border-radius: var(--radius-sm);
}
input:checked + .slider:before { transform: translateX(3.5vmin); }
input:checked + .slider { background-color: #4CAF50; }
input:focus + .slider { box-shadow: 0 0 1px #2196F3; }
/*.slider:after { content: 'OFF'; color: black; position: absolute; transform: translate(-50%, -50%); top: 50%; left: 50%;  }*/
/*input:checked + .slider:after { content: 'ON'; }*/

/* Tabs */
.warpper { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tab {
  cursor: pointer; padding: 10px 20px; margin: 0 2px; background: var(--bg-2);
  display: inline-block; border-radius: 4px 4px 0 0; box-shadow: 0 0.5rem 0.8rem #00000080;
}
.panels {
  width: 95%; border-radius: var(--radius-sm); padding: 10px;
  background: var(--panel-grad);
}
.panel { display: none; animation: fadein .8s; }
.radio { display: none; }
#one:checked ~ .panels #one-panel,
#two:checked ~ .panels #two-panel,
#three:checked ~ .panels #three-panel
 { display: block; }
#one:checked ~ .tabs #one-tab,
#two:checked ~ .tabs #two-tab,
#three:checked ~ .tabs #three-tab {
  background: var(--panel-grad-2);
}

/* Accordéon */
.fsl-accordion-wrapper { display: block; padding: 10px; }
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn {
  margin: 0; position: relative; padding: 14px 12px; display: block; cursor: pointer;
  text-align: left; -webkit-text-stroke: 1px var(--textOutline);
  paint-order: stroke fill;
  color: var(--accordion-color);
}
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn * { pointer-events: none; }
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn span {
  position: absolute; right: 3.5vw; top: 2%;
}
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn span:after,
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn span:before {
  content: ""; width: 1vh; height: 3vh; border-radius: 2px; background-color: var(--brand); position: absolute; top: 6px;
}
.fsl-accordion .fsl-accordion-container .fsl-accordion-btn span:before { transform: rotate(90deg); transition: .3s ease-in-out; }
.fsl-accordion .fsl-accordion-container .fsl-accordion-panel {
 transition: .2s ease-in-out; opacity: 0; max-height: 0; overflow: hidden; padding: 0 20px;
}
.fsl-accordion .fsl-accordion-container.active .fsl-accordion-btn span::before { transform: rotate(0deg); }
.fsl-accordion .fsl-accordion-container.active .fsl-accordion-panel { padding: 20px; opacity: 1; max-height: 100%; }
.fsl-accordion .fsl-accordion-container.active .fsl-accordion-btn,
#one:checked ~ .tabs #one-tab,
#two:checked ~ .tabs #two-tab,
#three:checked ~ .tabs #three-tab,
#four:checked ~ .tabs #four-tab { color: var(--lightOn); text-shadow: 0 0 4px var(--lightOn); }

/* Tooltips */
.tooltip { position: relative; display: inline-block; }
.tooltip .tooltiptext {
  z-index: 3;visibility: hidden; background: var(--tooltip-bg); color: var(--tooltip-text);
  text-align: center; border-radius: var(--radius-xs); padding: 5px; position: absolute; bottom: -80%; left: 50%; margin-left: -50px; opacity: 0; transition: opacity .3s;
}
.tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }

/* Help icon */
.help { cursor: help; }
.help::before {
  content: '❔'; opacity: .4; padding: 5px; border-radius: 50%; border: 1px solid var(--textOutline); width: fit-content;
}

/* Boards */
.boards { display: flex; margin-top: 10px; }
.board {
  border: 2px solid var(--bg); border-radius: var(--radius-xs); margin: 0 10px;
  background-image: var(--steel-grad); animation: fadein .5s; box-shadow: var(--bank-shadow);
}
.board h3 { padding: 10px; margin: 0; color: black; }

/* Emphase visuelle */
.textShad { text-shadow: 2px 3px 5px #fff; }
.emboss, .fsl-accordion-container{
  border-top: var(--border-emboss-top);
  border-bottom: var(--border-emboss-bottom);
  border-left: var(--border-emboss-left);
  border-right: var(--border-emboss-right);
  align-self: start;
}

/* Dropdown editable */
.dropdown { position: relative; }
.dropdown input { position: absolute;background-color: var(--input-bg);}

/* Bars de connexion & sync */
.connectbar {
  background-image: var(--connectbar-red);
  background-size: 60px 30px; animation: barra 3000ms linear infinite; height: 30px; border-radius: 15px;
}
.connectbar.sync { background-image: var(--connectbar-green); }
.connectbar.pendingConnect { background-image: var(--connectbar-blue); }

.barFrame {
  height: 14px;
  background: #000;      /* fond noir */
  border-radius: 9999px;    /* pill */
  overflow: hidden;
  border: 2px solid grey;
}

.syncbar {
  height: 100%;
  background: var(--ldc); /* couleur configurable */
  border-radius: inherit;
  border: 0;
  transition: width 3s linear;  /* slow progress */
  filter: drop-shadow(0 0 10px var(--ldc))        /* halo */
          drop-shadow(0 0 20px var(--ldc));  
}

.syncbar::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,
    rgba(255,255,255,0.8),
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.7)
  );
}


/* Menu contextuel */
.menuContainer {
  z-index: 1000; list-style: none; margin: 0; padding: 0;
  border: 4px solid var(--menu-border); border-radius: .5rem; background-color: var(--menu-bg);
}
.hide { display: none; }
.menuItem, .menuItemClose, .menuItemTitle { padding: .5rem; white-space: nowrap;}
.menuItem { text-align: center; color: grey; }
.menuItemClose { color: var(--danger); text-align: right; }
.menuItemTitle { color: var(--info); text-align: left; }
.menuItemDivider { border-bottom: 1px solid var(--menu-divider); height: 1px; }
.menuItemClose:hover, .menuItem:hover { background-color: var(--info); cursor: pointer; color: #fff; }

/* menu stripe */
#stripMenu{
    position: absolute;
}

#mobileMenu{
    right: 0; 
    top: 13vmin;
    position: fixed;
}

/* Menu mobile */
#mobileMenuBtn {
    position: fixed;
    top: 0;
    right: 0;
    user-select: none;  
    z-index:9999;
    background: rgba(51, 51, 51, 0.5);
    color: white;
    border-radius: 6px;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13vmin;
}

/* BANKS & GRID */
.bank {
  display: flex; flex-direction: row;  align-items: center;
  width: 100%; height: 100%; background-color: transparent;  overflow-x: auto; margin-left:5px;
  scrollbar-color: var(--brand) #000;
}
.gridParent {
  width: 100%; height: 97%; display: grid; flex: 0 0 auto;
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  background-color: var(--bg-2); position: relative; border-radius: var(--radius-lg);
  border: 2px solid var(--bg)
}
.grid-item {
  background-color: var(--bg); position: relative; display: flex; text-align: center; justify-content: center; align-items: center; color: #fff;
  background-size: 0px; background-position: center; border-radius: var(--radius-lg)
}

/* WIDGETS */
.widgets-container {
  display: flex; flex-direction: row; padding: 10px; background-color: var(--bg-3); border-radius: var(--radius-xs); color: #000; width: 80%; justify-content: center;
}
.widget-container { height: 5vw; width: 5vw; padding: 10px; cursor: pointer; }
.widget {
  width: 99%; height: 99%; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
  border-radius: 7px; border: 2px dashed grey; background-position: center; background-size: 100%;
}
.widget.draggable { max-width: 100%; overflow-x: visible; overflow-y: visible; }
.widget.dropped {
  margin: 2px; border: 2px solid #000; border-radius: 5px; box-shadow: var(--shadow-emboss);
}
.widget:active { cursor: grabbing; }

.widgetLabel, .stripID {
  border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #aaaaaa;
  text-shadow:
    -1px -1px 1px rgba(0,0,0,0.9),
     1px  1px 1px rgba(255,255,255,0.15),
     0px  0px 2px rgba(0,0,0,0.9);  
}
.widgetBottomLeft { position: absolute; margin-left: -10%; }

/* Icônes overlay */
.trash-icon, .move-icon, .config-icon, .copy-icon {
  color: #99b8c4; position: absolute; cursor: pointer; border-radius: var(--radius-xs);
}
.closeStripButton:hover,.bankIcon:hover, .trash-icon:hover, .config-icon:hover, .bankCopy:hover { background: var(--warn); color: #000; cursor: pointer; }
.copy-icon { top: 0.7vh; }
.move-icon { top: 0.7vh; left: 5px; }
.striptrash-icon { top: 5px; right: 5px; }
.move-icon::before { content: "✥"; }
.trash-icon::before { content: "❌"; color: var(--danger); }
.copy-icon::before { content: "📋"; }

/* Icône d’engrenage (configuration) */
.config-icon {
  bottom: 5px;
  right: 5px;
  position: absolute;
  color: #99b8c4;
  cursor: pointer;
  border-radius: var(--radius-xs);
}
.config-icon::before {
  content: "\1F527"; /* symbole clé à molette */
}

/* Mask & propriétés de strip */
.stripMask {
  width: 98%; height: 98%; background-color: var(--bg-4); color: #fff; z-index: 1000; justify-content: center; align-items: center;
  border: 2px solid var(--warn); border-radius: var(--radius-lg); color: var(--text);
}
.stripProperty, .skelName { width: 50%; display: block; justify-content: center; height: fit-content; align-items: center; }

.closeStripButton {
  color: #fff; position: absolute; border-radius: var(--radius-xs);
}

.closeStripButton{
    background-color: #4CAF50;  bottom: 0.5vmax; right:1vmax;
}

/* Bank header & actions */
.bankIcon, .bankCopy {
  position: relative; border-radius: var(--radius-xs); border: 0; background-color: transparent;
}
.bankSelector, .newBank, .toggleB {
  display: flex; justify-content: center; align-items: center; border-radius: var(--radius-sm);
  background: var(--bg-2); border: 1px solid grey; box-shadow: var(--shadow-press);
}

.toggleB { display: inline; padding: 4px; }
.toggleB:hover { cursor: pointer; }
.newBank:hover { background: var(--bg-3); }
.bankSelected { transform: scale(.97); border: 3px solid #000; box-shadow: inset 4px 4px 8px rgba(0,0,0,.7), inset -4px -1px 8px rgba(70,70,70,1); }
.addButton { background: transparent; color: #4CAF50; border: 0;}
.bankName {
  border: 0; border-bottom: 1px dashed rgba(160, 160, 160, 0.5); background: transparent; cursor: pointer; outline: none; color: inherit;
}
.bankName:focus { outline: none; }

/* Canvas & zones */
#connectionCanvas { position: absolute; pointer-events: none; z-index: 1000; }
#flexibleGridZone {
  display: flex; width: 100%; align-items: center; position: relative; margin-top: 10px; z-index: 2; justify-content: center;  /* centre horizontal */
}

/* LED */
.led { 
    display: inline-block;
    border: 4px solid black;
    border-radius: 50%; 
    background: radial-gradient(circle at 70% 30%, rgba(255,255,255,.7), rgba(255,255,255,0) 40%), radial-gradient(circle, var(--ldc), grey);   
}

.red   { --ldc: red; }
.blue  { --ldc: #2196f3; }
.green { --ldc: #4CAF50; }
.black { --ldc: black; }
.yellow{ --ldc: yellow; }
.grey  { --ldc: grey; }

.led.low{
  animation: flash 2s infinite;
}

.led.medium{
  animation: flash 0.5s infinite;
}

.led.fast{
  animation: flash 0.1s infinite;
}

.led.slow{
  animation: flash 2.5s infinite;
}


@keyframes flash {
    0% {  } 
    50% { background:radial-gradient(circle at 70% 30%, rgba(255,255,255,.5), rgba(255,255,255,0) 40%), black;  }

/* Sliders */
/* SLIDER GLOBAL -------------------------- */
input[type=range].custom-slider {

  padding: 0;
  outline: none;
  opacity: .8;
  background: transparent;      /* ← IMPORTANT sur mobile */

  transition: opacity .2s;
  cursor: pointer;              /* ← compatible mobile */

}

/* TRACK ---------------------------------- */
input[type=range].custom-slider::-webkit-slider-runnable-track {

  background-color: var(--brand); /* ← remis sur le track */
}

/* THUMB ---------------------------------- */
input[type=range].custom-slider::-webkit-slider-thumb {

  height: 2em;                 /* ← fix mobile crucial */

/* Char Popup */
.charPopupButton { font-family: fontUser; }
.charPopupButton:hover { background: var(--warn); cursor: pointer; }
.centeredPopup {
  position: absolute; top: 50%; right: 50%; transform: translate(50%, -30%); background-color: darkgrey; width: 90%;
  border-radius: var(--radius-lg); box-shadow: 0 2rem 2rem #00000080; margin-top: 10px; border: 1px solid black; animation: fadeIn .4s; display: none;
}
.charPopup-body { padding: 2% 2%; }
.closePopup { color: black; float: right; font-size: 5em; font-weight: bold; }
.closePopup:hover, .closePopup:focus { color: red; text-decoration: none; cursor: pointer; }

/* Collapsibles */

.lbl-toggle { color: LightGrey; display: block; text-align: center; cursor: pointer; transition: .25s ease-out; }
.lbl-toggle:hover { color: var(--lightOn); }
.lbl-toggle::before { content: '👉'; display: inline-block; vertical-align: middle; margin-right: .7rem; transform: translateY(-2px); transition: transform .2s ease-out; }
.toggle:checked + .lbl-toggle::before { transform: rotate(90deg) translateX(-3px); }

.toggle:checked + .lbl-toggle + .collapsible-content { max-height: 1000px; }
.content-inner {

}
.interface { margin: 2%; padding: 5%; border-radius: var(--radius-lg); align-self: start; }
#mainFrame { position: absolute; top: 10vh; width: 100%; }

}

}

@keyframes blink {

}

}

            async function runHttpQueue() {
              if (httpBusy) return;  
              httpBusy = true;
            
              while (httpQueue.length > 0) {
                const task = httpQueue.shift();
                try {
                  await task();   // Exécute UNE tâche réseau
                } catch (err) {
                  //console.warn("HTTP task failed, retrying…", err);
                  //_e(i18n.gettext("HTTP task failed ") + err)
                  popup(i18n.gettext("HTTP task failed ") + err)
                  httpQueue.unshift(task);   // Retry en tête
                  await new Promise(r => setTimeout(r, 2000));
                  unfreeze();
                }
              }
            
              httpBusy = false;
            }
            
            function enqueueHttp(task) {
              httpQueue.push(task);
              runHttpQueue();
            }

            function updateDataSets(jsonValue) {
                const jsonObject = jsonValue;
                if (!Array.isArray(jsonObject)) return;
            
                for (let i = 0; i < jsonObject.length; i++) {
                    const provider = Object.keys(jsonObject[i])[0];
                    const addressValuePair = jsonObject[i][provider];
                    const address = Object.keys(addressValuePair)[0];
                    const value = addressValuePair[address];
            
                    const addr = normalizeAddress(address);
            
                    // --- 1️⃣ Mise à jour du DOM ---
                    // Attention: ton sélecteur cible des descendants de [provider="..."]
                    // (on garde tel quel pour ne pas casser ta structure)
                    const targets = document.querySelectorAll(`[provider="${provider}"] [address="${addr}"]`);
                    targets.forEach(el => el.textContent = value);
            
                    // --- 2️⃣ Mise à jour du dépôt local (format groupé) ---
                    const arr = getRepoProviderArray(provider);
                    if (!arr.length) continue;
            
                    // a) match exact (ex: dataset singleton ou adresse exacte)
                    let exact = arr.find(ds => ds && ds.address === addr);
                    if (exact) {
                        if (Array.isArray(exact.values) && exact.values.length === 1) {
                            exact.values[0] = value;
                        }
                        // sinon: on ne sait pas quel index modifier -> on ne détruit pas la liste
                        continue;
                    }
            
                    // b) match pattern %d (ex: "/channel/%d")
                    for (const ds of arr) {
                        if (!ds || typeof ds.address !== "string") continue;
                        if (!ds.address.includes("%d")) continue;
            
                        let indexMatch;
                        try {
                            indexMatch = sscanf(addr, ds.address)[0];
                        } catch (e) {
                            indexMatch = null;
                        }
            
                        if (indexMatch != null && indexMatch != undefined && Array.isArray(ds.values)) {
                            const pos = indexMatch - 1; // convention 1..N
                            if (pos >= 0 && pos < ds.values.length) {
                                ds.values[pos] = value;
                                break;
                            }
                        }
                    }
                }
            }

            function jsonUpdate(jsonDoc, source) {
                // Parcourir chaque clé de l'objet source
                for (let [key, value] of Object.entries(source)) {
                    // Si la clé existe dans l'objet destination et que la valeur est un objet
                    if (jsonDoc.hasOwnProperty(key) && typeof jsonDoc[key] === 'object' && !Array.isArray(jsonDoc[key])) {
                        // Appeler récursivement la fonction pour mettre à jour l'objet imbriqué
                        jsonUpdate(jsonDoc[key], value);
                    } else {
                        // Si la clé n'existe pas dans l'objet jsonDoc, ou si la valeur n'est pas un objet, mettre à jour la valeur
                        jsonDoc[key] = value;
                    }
                }
             }
             
            function getValue(searchedKey,jsonDoc) {
                for (let key in jsonDoc) {
            		//_l("checking key:"+key);		
                    if (jsonDoc.hasOwnProperty(key)) {
                        if (key === searchedKey) {
            				//valeur = JSON.stringify(jsonDoc[key]);
            				//valeur = valeur.slice(1, -1); // this removes double quote
            				return jsonDoc[key];
                        } else if (typeof jsonDoc[key] === 'object') {
            				//_l("enter "+key);
                            let valeur = getValue(searchedKey,jsonDoc[key]);
                            if (valeur !== undefined) {
                                return valeur;
                            }
                        }
                    }
                }
                // Si la clé n'est pas trouvée, vérifions les tableaux
                if (Array.isArray(jsonDoc)) {
                    for (let i = 0; i < jsonDoc.length; i++) {
                        let valeur = getValue(searchedKey, jsonDoc[i]);
                        if (valeur !== undefined) {
                            return valeur;
                        }
                    }
                }
                return undefined;
            } 
             
            
            function processIncomingJson(jsonTextInput) {

              const jsonObject = JSON.parse(jsonTextInput);
            
              for (let funcName in jsonObject) {
                if (jsonObject.hasOwnProperty(funcName)) {

             function openSocket(host){	
            	srv = 'ws://'+host+':3000';
            	//_l("startSocketEth");
            	const retryInterval = pingInterval/1.5; // Intervalle de reconnexion en millisecondes doit etre > pingInterval
            	connect();
            
            	function connect() {
            	    
                    if (wsocket && wsocket.readyState !== WebSocket.CLOSED) {
                        _l("WebSocket déjà active ou en cours de fermeture.");
                        return;
                    }
            	    
            	    
                    wsocket = new WebSocket(srv);	
                    _l(">>>>>>>new WebSocket: "+srv);
            	   
            	    wsocket.onopen = function(event) {
                        _l('WebSocket connection established');
            			// pinging in AP mode conflict with wifi AP when a wifi STA connexion could not be established
            			sleep(pingInterval).then(() => { startPing();}); // we start pinging 3 seconds after socket connection was established
            			
            			// Envoyer tous les messages dans la file d'attente
            			while (messageQueue.length > 0) {
            				//showPage();
            				const message = messageQueue.shift();
            				wsocket.send(message);
            				_l('Message sent from queue:'+message);
            			}			
            			//showPage();
            			loadConfig(callbackUponConnection);
            			
                    };	
            	
            		wsocket.onclose = function(evt) { 
            		    _l("===>socket closed");
            			stopPing();			
            			waiting(i18n.gettext('Reconnecting...'));
            			_("netWorkSyncIndicator").classList.remove("sync");
            			_l('WebSocket connection closed. Retrying in '+retryInterval+' ms...');
            			// Reconnexion après un délai
            			setTimeout(connect, retryInterval);	
            		};
            		
            		wsocket.onerror = function(evt) { 
            			_l('wsocketh '+evt.type); 
            			//if (evt.type == 'error'){
            				wsocket.close();	    
            				//location.reload();			
            			//}				   
            		};
            		
            		wsocket.onmessage = function(evt) { 
            			//_l("wsocketh received:<"+evt.data+">");
            			processIncomingJson(evt.data);
            		};
            	}

                function startPing() {
                    if (!wsocket) return;
                
                    clearInterval(pingID);
                    clearTimeout(pingTimeout);
                
                    pingID = setInterval(() => {
                        if (wsocket.readyState === WebSocket.OPEN) {
                            // Envoi du ping
                            wsocket.send('{"command":"ping","param":""}');
                
                            // Annule tout timeout précédent avant d'en créer un nouveau
                            clearTimeout(pingTimeout);
                
                            // Si aucune réponse n'arrive avant le prochain ping, on considère la connexion perdue
                            pingTimeout = setTimeout(() => {
                                _l(i18n.gettext('Connection lost'));
                                waiting(i18n.gettext('Waiting connection...'));
                                stopPing();
                                try { wsocket.close(); } catch(e) {}
                                _("netWorkSyncIndicator").classList.remove("sync");
                            }, pingInterval);
                        }
                    }, pingInterval);
                }

            
                function stopPing() {
            		clearInterval(pingID);
                    clearTimeout(pingTimeout);
                }            	
            	
            }

              return new Promise(resolve => setTimeout(resolve, ms));
            }

                    if (!interfaceGroups[groupName]) interfaceGroups[groupName] = [];
                }
            
                // Ajoute l’interface à son groupe logique
                interfaceGroups[groupName].push(interfaceName);
            
                // --- Si non exposée, on s’arrête ici ---
                if (!exposed) return;
            
                // --- Configure le nom du groupe ---
                groupNode.querySelector(".groupName").textContent = i18n.gettext(groupName);

                    iFace.id = interfaceName;

                iFace.querySelector(".lbl-toggle").htmlFor = interfaceName + "_toggle";
                iFace.querySelector(".toggle").id = interfaceName + "_toggle";
                iFace.querySelector(".interfaceIcon").textContent = icon;
            
                // --- Thématisation ---

            function normalizeAddress(address){
                if (typeof address === "string") return address;
            
                if (address && typeof address === "object") {
                    if (typeof address.address === "string") return address.address;
                    if (typeof address.pattern === "string") return address.pattern;
                    if (typeof address.path === "string") return address.path;
                    if (typeof address.template === "string") return address.template;
                }
            
                // Fallback : au moins on ne crashe jamais
                return String(address ?? "");
            }
            
            /*
            Helper centralisé : retrouve l’entrée {address, values} dans stripDataRepo[provider].            
            getRepoEntry(provider, addressTemplate)
            Lookup par (provider, addressTemplate).
            */
            function getRepoEntry(repo, provider, addressTemplate){
                const addr = normalizeAddress(addressTemplate);
                const arr = getRepoProviderArray(repo, provider);
                return arr.find(e => e && e.address === addr) || null;
            }
            
            
            
            // Retourne toujours un tableau, même si provider absent.
            function getRepoProviderArray(repo, provider){
                if (!repo || typeof repo !== "object") return [];
                const arr = repo[provider];
                return Array.isArray(arr) ? arr : [];
            }

            function scanGridItem(clientX, clientY, grid){

                if (isWithinGridBounds(x, y, 1, 4) ){

                        newWidgetMenu["1x4"] = true;    // memorize that this widget can be dropped by the menu
                        freeCell += 1;
                    }
                }
            
                
                if (isWithinGridBounds(x, y, 4, 1)){ 
                    if (!checkCollision(x, y, 4, 1, grid)){

                        freeCell += 1;
                    }

                    if (!checkCollision(x, y, 2, 2, grid)){
                        newWidgetMenu["2x2"] = true;
                        freeCell += 1;
                    }
                }
            
                if (isWithinGridBounds(x, y, 4, 4)){
                    if (!checkCollision(x, y, 4, 4, grid)){        
                        newWidgetMenu["4x4"] = true;

                    }
                }

                return freeCell;

            function duplicateWidget(element){
                /*

*/
                
                copy = element.cloneNode(true); // Dupliquer le widget

            function dropWidget(draggedElement,gridParent,x,y,sizeX, sizeY, stripValues=null){
                let elementToAdd;
            
                if (dropOrigin == "move") {
                    // mouvement d'une grille a l'autre
                    sourceGrid = draggedElement.parentElement;
                    if (sourceGrid !== gridParent) {
                        // ajouter les cellules qui combleront le trou laissé par le widget nue fois supprimé
                        addCells(draggedElement);
                        trashStrip(draggedElement);
                        //la suppression du widget est faite par l'operation transmitStrip qui arrive après
            
                        // Ajouter l'élément à la nouvelle grille
                        elementToAdd = draggedElement;
                        updateGrid(gridParent,elementToAdd);
                        parseGrid(sourceGrid,identifyGridItem);   // now that the grid layout has changed, we identify again the cells in the old  grid
                        dropOrigin = "duplicate"; // => to recreate the widget later on
                        
                    } else {
                        //mouvement dans une meme grille
                        elementToAdd = draggedElement;
                    }
            
                } else {
                    // check if the widget has an attached strip, otherwise create it and attach it below the widget element class
                    if (!draggedElement.querySelector(".stripMask")){
                        
                        strip = _("stripMaskTPL").cloneNode(true); 
                        strip.removeAttribute('id');
                        //_l(draggedElement.classList)
                        draggedElement.appendChild(strip);
                        widgetMask = _("widgetMaskTPL").cloneNode(true);
                        widgetMask.removeAttribute("id");
                        draggedElement.appendChild(widgetMask);

                        renderStrip(strip, stripValues);
                        // we had to create the strip so we display it in case it's a manually dropped one so user can configure it straight after drop
                        if (dropOrigin == "new"){
                            showStrip(strip);  
                            isChanged(strip);
                        }
                        
                        const {sizeX, sizeY}= getElementSize(draggedElement);
                        draggedElement.setAttribute("size",sizeX+"x"+sizeY);
                    }
                    
                    elementToAdd = draggedElement;
                    //elementToAdd.dataSet.size = size;
                    // coller manuellement les valeurs des inputs
                    const clonedInputs = elementToAdd.querySelectorAll('input, select, textarea');
                    
                    // restore the properties and field values
                    dropOriginalInputs.forEach((input, index) => {
                        // dupliaue le contenu des proprietés
                        if (input.type === 'text' || input.tagName.toLowerCase() === 'textarea') clonedInputs[index].value = input.value;
                        if (input.type === 'checkbox' || input.type === 'radio') clonedInputs[index].checked = input.checked;
                        if (input.tagName.toLowerCase() === 'select'){
                            clonedInputs[index].value = input.value;
                        }
                        
                        // duplique les evenements associées aux propriétées par buildSkeleton
                        if (input.classList.contains("stripProperty")) clonedInputs[index].onchange = input.onchange;
                    });                        

                    updateGrid(gridParent,elementToAdd);
                }
            
                placeElementInGrid(elementToAdd, x, y);
            
                // Ajouter les icônes de poubelle, de déplacement, de configuration et de copie
                addIcons(elementToAdd);
            
                addIconPickerListener(elementToAdd.querySelector(".stripMask"));
            
                // Appliquer la classe 'dropped' pour ajuster la taille de l'image
                elementToAdd.classList.add('dropped');
            
                // Applique le dégradé avec cet angle
                themify(elementToAdd,150, 355);
            
                elementToAdd.setAttribute("x",x);
                elementToAdd.setAttribute("y",y);
                
                //_l("dropped: "+sizeX+"x"+sizeY+" ("+x+", "+y+")");    
                parseGrid(gridParent,clearTargetCell);    
                parseGrid(gridParent,identifyGridItem);   // now that the grid layout has changed, we identify again the cells
                
                sortGrid(gridParent.closest(".bank"));
                if (dropOrigin == "duplicate"){
                    transmitStrip(elementToAdd.querySelector(".stripMask"));
                }
                else if (dropOrigin == "move") {
                    win = parseInt(elementToAdd.closest(".gridParent").getAttribute("window")) ;          
                    bank=elementToAdd.closest(".bank").id;
                    //_l("transmit move from "+posBeforeMove.x+","+posBeforeMove.y+" to "+x+","+y );
                    
                    //transmit('moveStrip',{bank:bank,x1:posBeforeMove.x,y1:posBeforeMove.y,x2:x,y2:y,win:win,positions:jsonStripPositions}); 
                    feedShortcuts();        
                    postQuery({command:"moveStrip",param:{bank:bank,id:idBeforeMove,x2:x,y2:y,win:win,positions:jsonStripPositions}})
                }
                
                elementToAdd.setAttribute("origin",dropOrigin);
                if (dropOrigin !== "new") elementToAdd.querySelector(".trash-icon").style.display = "none";
            }
            
            function themify(node,angle1, angle2){
                // Génère un angle aléatoire entre 30° et 120°
                const randomAngle = getRandomAngle(angle1,angle2);
                
                if (document.documentElement.dataset.theme == "dark")
                    node.style.background = `linear-gradient(${randomAngle}deg, #323232, #323232, #686868, #474747,#323232)`;
                else
                    //node.style.background = `linear-gradient(${randomAngle}deg, #BABABA, #BABABA, #CACACA, #F9F9F9,#BABABA)`;

            function placeElementInGrid(element, x, y) {
                const { sizeX, sizeY } = getElementSize(element)
                element.style.gridColumnStart = x + 1;
                element.style.gridRowStart = y + 1;
                element.style.gridColumnEnd = x + sizeX + 1;

                // Ajuste la taille du widget pour qu'il remplisse les cellules

            // Fonction pour calculer les coordonnées de la cellule cliquée
            function calculateXY(clientX, clientY, gridParent) {
                //_l("x: "+clientX+" y:"+clientY);
                const rect = gridParent.getBoundingClientRect();
                const {cellSizeX, cellSizeY} = getCellSize(rect);
                x = Math.floor((clientX - rect.left) / cellSizeX);
                y = Math.floor((clientY - rect.top) / cellSizeY);
                if (x<0) x = 0;
                return { x, y };
            }
            
            function getCellSize(rect){
                const sX = rect.width / 4;
                const sY = rect.height / 4;
                return {cellSizeX: sX, cellSizeY: sY}
            }
            
            // Fonction pour calculer les coordonnées depuis une cellule
            function calculateClient(cellX, cellY, gridParent) {
                const rect = gridParent.getBoundingClientRect();
                const {cellSizeX, cellSizeY} = getCellSize(rect);
                x = Math.floor( rect.left +  (cellSizeX*cellX)+cellSizeX/2 ); // return the middle coordinate of the cell
                y = Math.floor( rect.top +  (cellSizeY*cellY)+cellSizeY/2 );
                //_l("cellX: "+cellX+" cellY:"+cellY+" => ("+x+","+y+") ");
                return { clientX:x, clientY:y};
            }
            
            // Fonction pour déterminer la taille du widget
            function getElementSize(element) {
                if (element.classList.contains('widget-1x4')) return { sizeX: 1, sizeY: 4 };
                if (element.classList.contains('widget-4x1')) return { sizeX: 4, sizeY: 1 };
                if (element.classList.contains('widget-4x4')) return { sizeX: 4, sizeY: 4 };
                return { sizeX: 2, sizeY: 2 };
            }
            
            // Fonction pour vérifier si le widget dépasse de la grille
            function isWithinGridBounds(x, y, sizeX, sizeY) {
                const maxX = 4;
                const maxY = 4;
                return (x + sizeX <= maxX) && (y + sizeY <= maxY);
            }
            
            // Fonction pour vérifier si une collision existe avec un autre widget
            function checkCollision(x, y, sizeX, sizeY, gridParent, currentElement = null) {
                
                collide = false;
                
                const allGridItems = gridParent.children;
                for (let item of allGridItems) {
                    // Ignorer la collision avec le widget lui-même
                    if (currentElement != null) if (item === currentElement) continue;
            
                    const itemX = parseInt(item.style.gridColumnStart) - 1;
                    const itemY = parseInt(item.style.gridRowStart) - 1;
                    const itemSizeX = parseInt(item.style.gridColumnEnd) - item.style.gridColumnStart;
                    const itemSizeY = parseInt(item.style.gridRowEnd) - item.style.gridRowStart;

                    if (
                        itemX < x + sizeX &&
                        itemX + itemSizeX > x &&
                        itemY < y + sizeY &&
                        itemY + itemSizeY > y
                    ) {
                        collide = true; // Collision détectée
                        break;
                    }
                }

                return collide;
            }

                    });

                    if (event.target.classList.contains('grid-item')){
                        if (widgetDropMenuIsOpen) hideWidgetDropMenu();
                        else{
                            possibleOptions = scanGridItem(event.clientX,event.clientY,grid);
                    
                            newWidgetMenu["event"] = event;    
                    
                            if (possibleOptions == 1 ){
                                if (newWidgetMenu["1x4"]) shape=".widget-1x4"
                                if (newWidgetMenu["4x1"]) shape=".widget-4x1"
                                if (newWidgetMenu["2x2"]) shape=".widget-2x2"
                                if (newWidgetMenu["4x4"]) shape=".widget-4x4"
                                createWidget(shape,event,grid,"new")
                            }
                            else if (possibleOptions>1) showWidgetDropMenu(grid);
                            else{
                                event.target.classList.add("destNOK");
                                setTimeout(() => { event.target.classList.remove("destNOK");}, 100);                    
                            }
                            
                        }
                    }
                    })
                  
                    grid.addEventListener("mouseover", (event) => {
                        //_l(x+","+y+"=>"+event.target.classList);
                        if (event.target.classList.contains('grid-item')){        
                            if (previousTarget != event.target){
                                clearTargetCell(previousTarget);
                                previousTarget = event.target;
                                /*freeCell = scanGridItem(event.clientX,event.clientY,grid);   
                                if (freeCell > 0) event.target.classList.add("destOK");
                                else event.target.classList.add("destNOK");*/
                                if (event.target.classList.contains("single-widget") || event.target.classList.contains("widget-menu")) event.target.classList.add("destOK");
                                else event.target.classList.add("destNOK");
                                
                            }        
                        }else if (event.target.classList.contains('widget')){
                            clearTargetCell(previousTarget);
                        }
                    })      
                  
                    grid.addEventListener('dragover', (event) => {
                           
                        event.preventDefault();
                        
                        const { x, y } = calculateXY(event.clientX, event.clientY, grid);
                        const { sizeX, sizeY } = getElementSize(draggedElement);
                    
                    
                        if (previousTarget != event.target){
                            clearTargetCell(previousTarget);
                            if (event.target.classList.contains('grid-item')){
                                if (isWithinGridBounds(x, y, sizeX, sizeY) && !checkCollision(x, y, sizeX, sizeY, grid, draggedElement)) event.target.classList.add("destOK");
                                else event.target.classList.add("destNOK");
                                previousTarget = event.target;                                            
                            }else previousTarget = event.target;
                            //
                        }
                    
                    
                    });
                    
                    // Gestion du drop dans chaque grille
                    grid.addEventListener('drop', (event) => {
                        event.preventDefault();
                        //dropSound.play();
                    
                        const { x, y } = calculateXY(event.clientX, event.clientY, grid);
                        const { sizeX, sizeY } = getElementSize(draggedElement);
                    
                        if (isWithinGridBounds(x, y, sizeX, sizeY) && !checkCollision(x, y, sizeX, sizeY, grid, draggedElement)) {
                            dropWidget(draggedElement,grid,x,y,sizeX, sizeY);
                        }
                    });      
                    
                    parseGrid(grid,identifyGridItem);     
            }

            function renderStrip(stripObj,stripValues = null){

                interfacesDropDown = stripObj.querySelector(".interfaces");

                    stripObj.querySelector(".charPopupButton").textContent = icon;
                }else{

                // qui est celui actuellement selectionné dans la dropdown
                // -------------------------------
                    stripSkelName = stripObj.querySelector(".skelName").value; 
                    propertiesValues = null;
                } 
                
            	
                /// -------------------------------
                // Le skeleton va nous indiquer les interfaces disponibles a partir du groupe auquel il appartient
                // -------------------------------
                skeleton = getTemplate(stripSkelName,stripSkeletonsDef);

                skelID = Object.keys(skeleton)[0]
                skelGroup = skeleton[skelID];    
                
                if (interfaceGroups.hasOwnProperty(skelGroup)){
                    // avant de regenerer les données, on mémorise le strip selectionné
                    // au cas ou le user a fait une modif
                    iFace = interfacesDropDown.value; // take the interface selected in the dropdown as default value
                    // populate the dropdown with the interfaces values names from the group
                    emptyElement(interfacesDropDown);
                    for (var i = 0; i < interfaceGroups[skelGroup].length; i++){
                        addDropDownEntry(interfacesDropDown,interfaceGroups[skelGroup][i],interfaceGroups[skelGroup][i]);
                    }
                    
                    // restore the selected interface either from saved user choice or from the serialization
                    if (stripValues != null) iFace = stripValues["interface"];
                    interfacesDropDown.value = iFace;
                    //blink the dropdown to indicate interface is incorrect      
                    if (interfacesDropDown.selectedIndex == -1) interfacesDropDown.selectedIndex = 0;

                    interfaceChanged(interfacesDropDown,propertiesValues);                  
                    

                }else{
                    modal("Missing interface group <"+skelGroup+"> from skeleton <"+stripSkelName+">")
                    addDropDownEntry(interfacesDropDown,"default","default");  
                    return;
                }
                

            }
            
            
            function interfaceChanged(dropDownEl,propertiesValues = null){
                iFace = dropDownEl.value;
                stripObj = dropDownEl.closest(".stripMask");
                
                // we now extract the data provider corresponding to the selected interface
                for (const entry of interfaceRepoJson) {
                  const key = Object.keys(entry)[0]; // ex: "AppleMIDI"

            function buildSkeleton(repo, tplName,jsonDefinitions,targetEl,properties,propClass){
                
                emptyElement(targetEl);
                var tpl = getTemplate(tplName,jsonDefinitions);   
                
                if (tpl == undefined){
                    modal("No template for "+tplName+" in repo: "+JSON.stringify(repo));  
                    return;
                }

                const tplProperties = tpl.properties;
                

                if (properties != null && properties.length != 0){
                    /*  CASE 1: the buildskeleton is called with propeties values which are passed in parameter: it means we restore a node with values, 
                        in that case we browse the lisof of perperties and created an input for eahc of them with assigning them the value
                    */
                    for (let p=0;p<properties.length;p++){
                        const property = properties[p]
                        safeProperty = replaceAllChars(property," ",SAFE_SCANF_SPACE);        // replace the space by ^ so the scanf function can work                        
                        

                        for (var i=0; i<tplProperties.length;i++) {         
                            const tplProperty = tplProperties[i];
                            const address = Object.keys(tplProperty)[0]; // address  in a json object such {"/strip/id/%s": ["freetext","velocity", "0-160"]}
                            const rules = tplProperty[address];    // rules contains the input definition array ["freetext","velocity", "0-160"]
                            //example : comparing /ch/config/02/name /ch/%02d/config/name
                            //sscanf('SN/2350001/hello', 'SN/%d/%s') return [2350001,"hello"]
                            var inputValues=sscanf(safeProperty,address); // an array of matched values
                            if (inputValues[0] != null){
                                createInput(repo, address,propClass,targetEl,rules,inputValues);
                                break;
                            }
                        }
                          
                    }                        
                }else{
                    /* CASE 2 : the buildskeleton is called to fill in a new node without any value (ex. creation of a strip from scracth)
                        in that case we instantiate all the input from the skeleton and do not assign any value
                    */
                    for (var i=0; i<tplProperties.length;i++) {         
                        const tplProperty = tplProperties[i];
                        const address = Object.keys(tplProperty)[0]; // address  in a json object such {"/strip/id/%s": ["freetext","velocity", "0-160"]}
                        const rules = tplProperty[address];    // rules contains the input definition array ["freetext","velocity", "0-160"]
                        createInput(repo, address,propClass,targetEl,rules);
                    }
                }
                return tpl;
            }
            
            
            function createInput(repo, address,propClass,targetEl,rules,inputValues=""){
                const type = rules[0]; // first data of the array is always the type and it must be present ["freetext","velocity", "0-160"], in this case: freetext
                clonedNode =  _(type+"TPL").cloneNode(true);
                populateDataCallBack = "populate"+type;
                
                // retrieve the provider that was attached to the note and callback the dataSets creation accordingly
                provider =  targetEl.closest('[provider]').getAttribute("provider");

                // restore the value by removing any SAFE_SCANF_SPACE
                if (Array.isArray(inputValues)){
                    inputValues = inputValues
                        .map(uv => replaceAllChars(uv, SAFE_SCANF_SPACE, " "))
                        .join(" ");
                }

                window[populateDataCallBack](clonedNode,address,inputValues,provider,rules,repo);   
                // populatedropdown(dropDown, address, valueArray, provider)
                // populatefreetext(target, address, valueArray, provider, rules)
    
                //clonedNode.style.display = "block";					
    			//clonedNode.classList.add(address);
    			clonedNode.classList.add(propClass);
                
                // the class determines the behaviour of the properties, hence which function to call when it changes => handleChange
    			// by default, 
    			var handleChange;

                // a dropdown selectin will always cleasn the highlight indicator as you can only select a valid avlue from the list
                // for otehr field, the handle Change attached by the populatefreetext or populateuint or ... will take care of 
                // applying a validator based on regex that will clean the highlight class if the data is valid 
    			
    			switch (propClass){
    			    case "stripProperty":
    			        handleChange = function(event) {
    			            refreshWidget(event.target.closest('.stripMask'), true);
    			            if (event.target.tagName === 'SELECT') event.target.classList.remove("highlight");
    			        }
    			    break;
    			    case "shortcutProperty":
    			        handleChange = function(event) {transmitShortcut()}
    			    break;
    			    case "IFproperties":
    			        handleChange = function(event) {
    			            if (event.target.tagName === 'SELECT') event.target.classList.remove("highlight");
    			            // POUR BIEN FAIRE AVANT DE METTRE A FALSE, IL FAUDRAIT VERIFIER QU'AUCUNE PROPERTY DU interfaceCfgContent N'A DE CLASSE "HIGHLIGHT"
    			        }            			        
    			    break;
    			}
                clonedNode.addEventListener('change', handleChange);
                //clonedNode.onchange = handleChange;
    			
    			clonedNode.setAttribute("address",address); // SET THE TOP STRIP GENERIC ADDRESS 
    			clonedNode.removeAttribute("id");	
    			
                const fName = rules[1] ? rules[1]:""; // second data of the array is always the fieldName and is optionnal ["freetext","velocity", "0-160"], in this case: freetext    			
    			targetEl.appendChild(document.createTextNode(fName+" "))
    		    targetEl.appendChild(clonedNode);
    		    return clonedNode;
            }

            function refreshwidgetLabels(strip){

                for (let el of freetexts) if (selected.length < 2) selected.push(el);

                    var text;
                    var address;
                    
                    switch (type){
                        case 'dropdown':
                            index = property.selectedIndex;
                            if (index != -1){
                                option = property.options[index];
                                text = option.textContent;
                            }else{
                                text = undef;
                                option = property.options[0];

                        break;

                    labelNode.textContent = text;
                    if (text == undef) labelNode.classList.add("highlight");
                    else labelNode.classList.remove("highlight");
                    labelNode.setAttribute("address",address); 
                    
                    
                });

            function drawCurve() {
                
              if (isTouchScreen()) return;
              if (countBanks() == 0) return;
              
              const gridContainer = _(activeBank);
              //const gridContainer = _("flexibleGridZone");
              
              const canvas = _('connectionCanvas');
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height); // Effacer le canvas
            
              position = gridContainer.getBoundingClientRect();
              
              // Ajuster la taille et position du canvas pour etre la meme que le conteneur grid
              canvas.style.left = position.left+'px'
              canvas.style.top = gridContainer.style.top+'px' //position.top+'px'; does not work
              
              let yOffset = (position.top - gridContainer.style.top); // for some reason, there s a difference between position reported, hence we have to define a delta 
            
              canvas.width = position.width;
              canvas.height = position.height;
              
              /*canvas.style.border="5px solid green";
              gridContainer.style.border="5px dashed orange";*/
              
              // design des connexions
            
              ctx.lineWidth = 8; // Épaisseur de la ligne
              ctx.strokeStyle = 'yellow'; // Couleur de la ligne
              ctx.setLineDash([1, 2]);
              ctx.shadowColor = '#FF5733';
              ctx.globalAlpha = 0.9;
              ctx.shadowBlur = 8;
            
              const divs = Array.from(_(activeBank).querySelectorAll('.uniqueID')).sort((a, b) => {
                // we collect the id  and sort them
                a = parseInt(a.textContent);
                b = parseInt(b.textContent);
                
                //console.log("a:"+a+", b:"+b);
                
                return a - b;
              });
            
            
              for (let i = 0; i < divs.length - 1; i++) {
                  
                origin =  divs[i].closest(".widget")
                destination = divs[i+1].closest(".widget")
                  
                const start = origin.getBoundingClientRect();
                const end = destination.getBoundingClientRect();
            
                // we adjust the offset to position link in the middle of the widget
                startYOffset = yOffset - start.height/2.5;
                endYOffset = yOffset - end.height/2.5;
                startXOffset = start.width/5;
                endXOffset = end.width/5;
            
                const startX = start.left+startXOffset
                const startY = start.top-startYOffset 
                const endX = end.left+endXOffset  
                const endY = end.top-endYOffset 
            
                //console.log("start: ("+parseInt(startX)+","+parseInt(startY)+"), end:("+parseInt(endX)+","+parseInt(endY)+")");
            
                if (endY<0 ||startY<0) return;
            
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            
                // Courbe de Bézier pour relier les points
                const controlX = (startX + endX) / 2;
                const controlY = Math.min(startY, endY) - 50; // Ajuster pour la courbure
            
            
                ctx.quadraticCurveTo(controlX, controlY, endX, endY);
                ctx.stroke();
                drawArrowhead(ctx, endX, endY, Math.atan2(endY - controlY, endX - controlX));
                drawArrowhead(ctx, startX, startY, Math.atan2(startY - controlY, startX - controlX));
              }
                //sleep(5000).then(() => { _('connectionCanvas').classList.add("fadeOut") });
            }
            
            function drawArrowhead(ctx, x, y, angle) {
              const arrowLength = 20; // Longueur de la pointe de flèche
              ctx.beginPath();
              ctx.moveTo(x, y);
              ctx.lineTo(x - arrowLength * Math.cos(angle - Math.PI / 6), y - arrowLength * Math.sin(angle - Math.PI / 6));
              ctx.lineTo(x - arrowLength * Math.cos(angle + Math.PI / 6), y - arrowLength * Math.sin(angle + Math.PI / 6));
              ctx.closePath();
              ctx.fillStyle = ctx.strokeStyle;
              ctx.fill();
            }

                if (theme == "light") theme = "dark"; else theme = "light";
                theme = document.documentElement.dataset.theme = theme;
                setCookie('intervalTheme', theme,100);

            // ⚙️ Sauvegarder JSON vers le serveur
            async function saveLibrary(source,filename) {
              const obj = {};
              const rows = source.querySelectorAll(".entry");
              rows.forEach(row => {
                const key = row.querySelector("input").value.trim();
                const val = row.querySelector("textarea").value.trim();
                if (key) obj[key] = val; // ignore les clés vides
              });
        
              //if (validForm(source)) transmit('saveLibrary',{file: filename, entries: obj},6000); // 6s as it takes time to save file
              if (validForm(source)) postQuery({
                    command: "saveLibrary",
                    param: {file: filename, entries: obj}
                });
        
            }

            function fetchFromFile() {
                waiting("⌛ "+i18n.gettext("Uploading file"));
                var e = _("file1").files[0],
                    t = new FormData();
                t.append("file1", e), uploadPackage(t);
            }

            function uploadPackage(e) {
                var t = new XMLHttpRequest();
                t.upload.addEventListener("progress", progressHandler, !1);
                t.addEventListener("load", completeHandler, !1);
                t.addEventListener("error", errorHandler, !1);
                t.addEventListener("abort", abortHandler, !1);
                //t.open("POST", "/upload"); // for esp32
                t.open("POST", "upload/");   // for simul 
                t.send(e);
            }


            function progressHandler(e) {
                //_("loaded_n_total").innerHTML = "Total " + e.loaded + " bytes";
                var t = (e.loaded / e.total) * 100;
                (_("uploadBar").value = Math.round(t)),
                    (_("status").innerHTML = i18n.gettext("Uploading file") + " " + Math.round(t) + "%"),
                    t >= 100 && (_("status").innerHTML = i18n.gettext("Uploading file"));
            }


            function completeHandler(e) {
                showPage();
                var xhr = e.target;

                _("uploadBar").value = 0;
                var text = i18n.gettext(xhr.responseText.slice(0, 200));
                _("status").innerText = text;
            
                if (xhr.status != 200) {
                    modal("Error");
                }
            }


            function errorHandler(e) {
                _("uploadBar").value = 0;
                _("status").innerHTML = "Upload Failed";
                showPage();
                //"Network error (no HTTP response
                modal("File transfer error");
            }

            function abortHandler(e) {
                _("uploadBar").value = 0;
                _("status").innerHTML = "Upload Aborted";
                showPage();
                modal("Upload aborted by user");                
            }

/* ------------------------------ FILE FIFO DES POPUPS --------------------------------*/
/* ------------------------------ FILE FIFO DES POPUPS --------------------------------*/
const popupQueue = [];

/* ------------------------------ API PUBLIQUE --------------------------------*/

function modal(question) {
    popup(question, [["OK"]]);
}

function popup(question, actions) {
    popupQueue.push({ question, actions });
    lancerPopupSuivant();
}

/* ------------------------------ GESTIONNAIRE DE FILE --------------------------------*/
function lancerPopupSuivant(){ 
    if (popupQueue.length === 0) return; 
    const next = popupQueue.shift();
    if (!next) return;

    const { question, actions } = next;
    buildPopup(question, actions);
}

/* ------------------------------ AFFICHAGE D’UN POPUP --------------------------------*/
function buildPopup(question, actions) {
    const overlay = document.createElement("div");
    overlay.className = "popup-overlay";

    const box = document.createElement("div");
    box.className = "popup-box";

    const p = document.createElement("p");
    p.textContent = i18n.gettext(question);
    box.appendChild(p);

    if (Array.isArray(actions) && actions.length > 0) {
        actions.forEach(action => { 
            const label = action[0]; 
            const callback = action[1];

            const btn = document.createElement("button");
            btn.className = "popup-btn";
            btn.textContent = i18n.gettext(label);

            btn.onclick = () => {
                if (typeof callback === "function") callback();
                removePopup(overlay);
                _("loadingDiv").classList.remove("greyedout");
            };

            box.appendChild(btn);
        });
    }

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    requestAnimationFrame(() => {
        overlay.style.opacity = "1";
        box.style.transform = "scale(1)";
    });
}

/* ------------------------------ FERMETURE --------------------------------*/
function removePopup(overlay) {
    overlay.remove();
}
