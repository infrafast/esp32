<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link rel="stylesheet" href="style.css">
        <script src="gettext.iife.js"></script>
        <script src='interval.js'></script>
        <script src='user.js'></script>
    </head>
    <body onload="initWizard();">

        <div id="waitingDiv" class="loader">  
          <div id="waitingMsg" class="waitingDivText">Loading...</div>
          <div class="bar left"></div>
          <div class="bar top"></div>
          <div class="bar right"></div>
          <div class="bar bottom"></div>
        </div>  
        <div class="k-progress-line topProgressBar"></div>                                
        <div id="loadingDiv" style="display:none">
            💬<select id="translationDropDown" onChange='setLang(this.value,resumeTour);transmit("set",{section:"system",id:"lang",value:this.value});' style="width:150px; height:25px"></select><a href='https://footswitch.groupe-interval.fr/support-contact' target="_blank" style="font-size:23;" id="supportURL">&#127384;</a><button id="saveBt" style="display:none">💾</button>						
            <div class="warpper">
                <input class="radio" id="one" name="group" type="radio" checked>
                <input class="radio" id="two" name="group" type="radio">
                <input class="radio" id="three" name="group" type="radio">
                <div class="tabs">
                    <label class="tab" style="font-size:60px" id="one-tab" for="one">&#10102;</label>
                    <label class="tab" style="font-size:60px" id="two-tab" for="two">&#10103;</label>
                    <label class="tab" style="font-size:60px" id="three-tab" for="three">&#10104;</label>
                </div>
                <div class="panels">
                    <div class="panel" id="one-panel">
                        <div class="board">
                            <h2 class="lightOn"><i18n id="Step 1: connect the network"></i18n></h2>
                            <h2>
                                <div w3-include-html="connectivity.html" onloadCallBack="initConnectivity"></div>
                            </h2>
                        </div>
                        <div>
                            <button class="button" id="firstStepNext" disabled onclick="document.getElementById('two').click();" style="width:10%; float: right; height:100; font-size:50;">&#9193;</button>
                        </div>
                    </div>
                    <div class="panel" id="two-panel">
                        <div class="board">
                            <h2 class="lightOn"><i18n id="Wizard Step 2"></i18n></h2>
                            <h2><center>
                                <div class="fsl-accordion-wrapper">
                                    <div class="fsl-accordion multiple" id="wizardAccordions">
                                        <div w3-include-html="user.html" onloadCallBack="initUser"></div>
                                    </div>
                                </div>
                            </center></h2>
                            <button class="button" onclick="document.getElementById('one').checked=true;" style="width:10%; float: left;height:100; font-size:50;">&#9194;</button>
                            <button class="button" id="secondStepNext" onclick="document.getElementById('three').click();" style="width:10%; float: right; height:100; font-size:50;">&#9193;</button>
                        </div>
                    </div>
                    <div class="panel" id="three-panel">
                        <div class="board">
                            <h2>
                                <div style="width:100%">
                                    <p class="lightOn"><i18n id="Step 3: Congrats!"></i18n></p>
                                    <p><button onclick="window.location.href = '/';"><i18>Continue with user configuration</i18>   >>>>></button></p>
                                </div>
                            </h2>
                        </div>
                        <div>
                            <button class="button" onclick="document.getElementById('two').checked=true;" style="width:10%; float: left; height:100; font-size:50;">&#9194;</button>
                        </div>
                    </div>
                </div>
            </div>
            <p><label style="font-size:12px; color:white; float: right; padding-right:100px"><span id="host">demo</span> / v0.10a / <span id="intervalJSversion">vx.x</span></label></p>            
        </div>
    </body>
</html>
