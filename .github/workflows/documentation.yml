name: Class documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/Interval/src/**'
      - 'Doxyfile'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'lib/Interval/src/**'
      - 'Doxyfile'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: class-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install documentation tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Generate class reference and SVG diagrams
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile
      - name: Verify HTML and SVG output
        shell: python
        run: |
          from pathlib import Path
          root = Path("build/doxygen/html")
          for name in ("index.html", "annotated.html"):
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty HTML output: {path}")
          # Doxygen may escape underscores in graph file names.
          for kind in ("inherit", "coll"):
              graphs = [p for p in root.glob(f"*{kind}*graph.svg") if p.stat().st_size]
              if not graphs:
                  raise SystemExit(f"No {kind} SVG diagrams found in {root}")
              print(f"{kind}: {len(graphs)} diagrams; example: {graphs[0].name}")
      - name: Upload browsable reference
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: class-documentation
          path: build/doxygen/html
          retention-days: 14
      - name: Upload parser warnings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: documentation-warnings
          path: build/doxygen/warnings.log
          if-no-files-found: ignore
      # Enable only after selecting GitHub Actions in Settings > Pages.
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PUBLISH_PAGES == 'true'
        run: tar --dereference --hard-dereference --directory build/doxygen/html -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PUBLISH_PAGES == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCS_PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish reference
        id: deployment
        uses: actions/deploy-pages@v4
