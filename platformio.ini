; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0 ; espressif32@6.4.0 => 3.20011.230801 (2.0.11) VALID ONE TO BE USED
;platform = espressif32@6.7.0 ;  espressif32@6.7.0 => 3.20011.230801 (2.0.11) WAS FOR TESTING FOTA BUT DOESNT WORK
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip ; WAS FOR TESTING FOTA BUT DOESNT WORK https://github.com/chrisjoyce911/esp32FOTA/issues/152#issuecomment-2296318623
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
; board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps = 
	; local libs are : TFT_espi and ethernet Ethernet@^2.0.2 with the patched applied from AWOT
	bblanchon/ArduinoJson
	jonblack/arduino-menusystem
	tobozo/ESP32-targz
	Bodmer/TJpg_Decoder	
	;links2004/WebSockets@^2.4.1
	cnmat/OSC@^1.0.0
	amcewen/HttpClient@^2.2.0
	mbed-seeed/BluetoothSerial@0.0.0+sha.f56002898ee8
	lasselukkari/aWOT@^3.5.0
	bodmer/JPEGDecoder@^2.0.0
	;pschatzmann/audio-tools
	ivanseidel/LinkedList@0.0.0-alpha+sha.dac3874d28
	;chrisjoyce911/esp32FOTA
	;https://github.com/skaarj1989/mWebSockets#meta  ; placed to local lib because of the local patch https://github.com/skaarj1989/mWebSockets/discussions/67#discussioncomment-10145705 and need to set frame size to 512 in config.h as per https://github.com/skaarj1989/mWebSockets/issues/72
	;https://github.com/andrew-susanto/Arduino-Ethernet-Icmp.git
	;marian-craciunescu/ESP32Ping@^1.7
	marian-craciunescu/ESP32Ping
	;arduino-libraries/Ethernet@^2.0.2    ; Ethernet@^2.0.2 with the patched applied from AWOT is local
	;arduino-libraries/ArduinoMDNS@^1.0.0
	peterus/ESP-FTP-Server-Lib
	;https://github.com/pschatzmann/TinyFTPClient.git
	;chrisjoyce911/esp32FOTA
	;bodmer/TFT_espi

[env:dev]
;build_type = debug
extra_scripts = pre:prescript.py
build_flags = 
	-D DEBUG=1
	;-D ICMPPING_ASYNCH_ENABLE
;	-D DEBUG_ESP_PORT=Serial	
;	-D DEBUG_ESP_WIFI 
	;-DDEBUG_ESP_HTTP_SERVER
	;-DDEBUG_ESP_HTTP_CLIENT
;	-D DEBUG_ESP_CORE
	;-DDEBUG_ESP_HTTP_UPDATE
	;-DDEBUG_ESP_UPDATER
	;-DDEBUG_ESP_OTA	

[env:prod]
extra_scripts = pre:prescript.py
build_flags = 
	;-D ICMPPING_ASYNCH_ENABLE
	-D PROD=1
