; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

; Application-owned paths. PlatformIO accepts consumer-defined options through
; the custom_ prefix; edit these when the webGUI or release folder moves.
custom_webgui_src = /Volumes/web/webGUI
custom_firmware_webapp_dest = ${PROJECT_DIR}/data/webapp
;custom_fwupdate_dest = ${PROJECT_DIR}/../fwupdate
custom_fwupdate_dest = /Volumes/web/fwupdate

lib_deps = file://../Interval

[env:dev]
build_flags = 
	-DINTERVAL_BUILD_DEV
build_src_flags =
	-D DEBUG

[env:prod]
build_type = release
build_flags = 
	-DINTERVAL_BUILD_PROD
