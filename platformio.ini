; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
custom_webgui_src = /Volumes/web/webGUI
custom_firmware_webapp_dest = ${PROJECT_DIR}/data/webapp
custom_fwupdate_dest = /Volumes/web/fwupdate
lib_deps = symlink://../Interval

[env:dev]
# Development-only diagnostics shared with the Interval library and its
# instrumented dependencies (for example the AppleMIDI packet tracer).
build_flags =
    -DINTERVAL_BUILD_DEV

# Keep DEBUG local to the application sources.  Do not promote it to
# build_flags: third-party libraries use DEBUG for their own SerialMon paths.
build_src_flags =
    -DDEBUG
    ;-DDEBUG_VERBOSE

[env:prod]
build_type = release
build_flags = 
	-DINTERVAL_BUILD_PROD
