; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0 ; espressif32@6.4.0 => 3.20011.230801 (2.0.11) VALID ONE PRE COMPILED TO BE USED
;platform = espressif32@6.5.0 ; = platformio/framework-arduinoespressif32 @ ~3.20014.0 (for Surface Control integration with esptinyUSB) works as well but doubt with wSocket library
;platform = espressif32@6.7.0 ;  espressif32@6.7.0 => 3.20011.230801 (2.0.11) WAS FOR TESTING FOTA BUT DOESNT WORK
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip ; WAS FOR TESTING FOTA BUT DOESNT WORK https://github.com/chrisjoyce911/esp32FOTA/issues/152#issuecomment-2296318623
;platform = espressif32@6.10.0 ; | espressif32@6.10.0 correspond à : | 👉 Arduino-ESP32 v3.2.0 (stable release officielle de mai 2024) | Référence : espressif32 releases DOES NOT WORK => NEED USE_HSPI_PORT which DISABLE ETHERNET

board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
; Interval exposes transitive headers (for example LinkedList.h) from its
; public framework headers; deep+ makes PlatformIO scan those dependencies.
lib_ldf_mode = deep+
extra_scripts = pre:../Interval/scripts/platformio_build.py

; Interval uses /Volumes/web/webGUI and ${PROJECT_DIR}/data/webapp by default.
; Override them only through WEBGUI_SRC/FIRMWARE_WEBAPP_DEST when needed.

; board_build.f_cpu = 240000000L
monitor_speed = 115200
; Use the sibling checkout as a local PlatformIO package. This keeps the
; framework sources local while still resolving Interval's own dependencies.
lib_deps = file://../Interval
; LinkedList is header-only and PlatformIO does not expose it reliably as a
; transitive dependency of a packaged library; keep this compatibility pin
; here while Interval remains the owner of the dependency declaration.
    ivanseidel/LinkedList@0.0.0-alpha+sha.dac3874d28
    cnmat/OSC@^1.0.0
    lasselukkari/aWOT@^3.5.0
    amcewen/HttpClient@^2.2.0
    FortySevenEffects/arduino_midi_library@^5.0.2
;lib_archive = no

[env:dev]	; dev uses the JTAG for serial mon/upload by default, nothing to do
;monitor_filters = esp32_exception_decoder
;build_type = debug
build_flags = 
	-DINTERVAL_BUILD_DEV
	;-D CORE_DEBUG_LEVEL=5
	;-Wformat						; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash
	;-Werror=format					; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash

; DEBUG is a firmware-source setting.  Do not export it to third-party
; libraries: AppleMIDI enables code that expects the application's SerialMon.
build_src_flags =
	-D DEBUG
	;-D DEBUG_VERBOSE

[env:prod]
build_type = release
build_flags = 
	-DINTERVAL_BUILD_PROD
	;-DCORE_DEBUG_LEVEL=0
