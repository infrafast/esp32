; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0 ; espressif32@6.4.0 => 3.20011.230801 (2.0.11) VALID ONE PRE COMPILED TO BE USED
;platform = espressif32@6.5.0 ; = platformio/framework-arduinoespressif32 @ ~3.20014.0 (for Surface Control integration with esptinyUSB) works as well but doubt with wSocket library
;platform = espressif32@6.7.0 ;  espressif32@6.7.0 => 3.20011.230801 (2.0.11) WAS FOR TESTING FOTA BUT DOESNT WORK
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip ; WAS FOR TESTING FOTA BUT DOESNT WORK https://github.com/chrisjoyce911/esp32FOTA/issues/152#issuecomment-2296318623
;platform = espressif32@6.10.0 ; | espressif32@6.10.0 correspond à : | 👉 Arduino-ESP32 v3.2.0 (stable release officielle de mai 2024) | Référence : espressif32 releases DOES NOT WORK => NEED USE_HSPI_PORT which DISABLE ETHERNET

board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs

; Application-owned webGUI packaging paths, consumed by Interval/scripts/preparefiles.py.
webgui_src = /Volumes/web/webGUI
firmware_webapp_dest = ${PROJECT_DIR}/data/webapp

; board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps =
	; Interval owns its framework and all libraries required by that framework.
	https://github.com/infrafast/Interval.git#v0.3.11

lib_ignore = MIDIUSB
;lib_archive = no

[env:dev]	; dev uses the JTAG for serial mon/upload by default, nothing to do
;monitor_filters = esp32_exception_decoder
;build_type = debug
build_flags = 
	-DINTERVAL_BUILD_DEV
	;-D CORE_DEBUG_LEVEL=5
	;-Wformat						; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash
	;-Werror=format					; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash

; DEBUG is a firmware-source setting.  Do not export it to third-party
; libraries: AppleMIDI enables code that expects the application's SerialMon.
build_src_flags =
	-D DEBUG
	;-D DEBUG_VERBOSE

[env:prod]
build_type = release
build_flags = 
	-DINTERVAL_BUILD_PROD
	;-DCORE_DEBUG_LEVEL=0
