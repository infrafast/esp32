; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0 ; espressif32@6.4.0 => 3.20011.230801 (2.0.11) VALID ONE PRE COMPILED TO BE USED
;platform = espressif32@6.5.0 ; = platformio/framework-arduinoespressif32 @ ~3.20014.0 (for Surface Control integration with esptinyUSB) works as well but doubt with wSocket library
;platform = espressif32@6.7.0 ;  espressif32@6.7.0 => 3.20011.230801 (2.0.11) WAS FOR TESTING FOTA BUT DOESNT WORK
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip ; WAS FOR TESTING FOTA BUT DOESNT WORK https://github.com/chrisjoyce911/esp32FOTA/issues/152#issuecomment-2296318623
;platform = espressif32@6.10.0 ; | espressif32@6.10.0 correspond à : | 👉 Arduino-ESP32 v3.2.0 (stable release officielle de mai 2024) | Référence : espressif32 releases DOES NOT WORK => NEED USE_HSPI_PORT which DISABLE ETHERNET

board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs

; board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps =  	
	;https://github.com/infrafast/Interval.git@0.0.8
	;sstaub/Ethernet3
	TrippyLighting/EthernetBonjour

	https://github.com/lathoub/Arduino-BLE-MIDI.git
	https://github.com/lathoub/Arduino-AppleMIDI-Library.git  
	https://github.com/lathoub/Arduino-USBMIDI.git	
	https://github.com/chegewara/EspTinyUSB.git               ; <======= USE THIS ONE which works with the patch but do not provide sysex

	;https://github.com/NicksonYap/Arduino-Ping-W5500.git		; ping for ethernet alternative which work but no longer maintained and uses ethernet2
	;https://github.com/BlakeFoster/Arduino-Ping.git			; ping for both ethernet and wifi :call for a w5100 method that is not cimplemented
	;https://github.com/andrew-susanto/Arduino-Ethernet-Icmp.git ; ping for ethernet doesnt work, crash at runtime
	
	;https://github.com/masterx1981/Ethernet.git ; ==> fix BlakeFoster ICMP ping by implementing missing W5100 functions but it has been installed locally with the fix for ethernet of awot

	;https://github.com/takkaO/OpenFontRender.git

	;tobozo/ESP32-PsRamFS

	https://github.com/takkaO/OpenFontRender.git#v1.1    ; version from 1.2 and after truncate font for some reason?
	bblanchon/ArduinoJson
	;tobozo/ESP32-targz
	https://github.com/tobozo/ESP32-targz.git#3423fae9657f2045bb4e569d479d58fc76a33ed5
	;https://github.com/tobozo/ESP32-targz.git#LZ77 ;tobozo/ESP32-targz	;
	Bodmer/TJpg_Decoder	
	;links2004/WebSockets@^2.4.1
	cnmat/OSC@^1.0.0
	amcewen/HttpClient@^2.2.0
	mbed-seeed/BluetoothSerial@0.0.0+sha.f56002898ee8
	lasselukkari/aWOT@^3.5.0
	bodmer/JPEGDecoder@^2.0.0
	;pschatzmann/audio-tools
	ivanseidel/LinkedList@0.0.0-alpha+sha.dac3874d28
	;chrisjoyce911/esp32FOTA
	;https://github.com/skaarj1989/mWebSockets#meta  ; placed to local lib because of the local patch https://github.com/skaarj1989/mWebSockets/discussions/67#discussioncomment-10145705 and need to set frame size to 512 in config.h as per https://github.com/skaarj1989/mWebSockets/issues/72
	;https://github.com/andrew-susanto/Arduino-Ethernet-Icmp.git
	;marian-craciunescu/ESP32Ping@^1.7
	marian-craciunescu/ESP32Ping
	;arduino-libraries/Ethernet@^2.0.2    ; Ethernet@^2.0.2 with the patched applied from AWOT is local
	;arduino-libraries/ArduinoMDNS@^1.0.0
	peterus/ESP-FTP-Server-Lib
	;https://github.com/pschatzmann/TinyFTPClient.git
	;bodmer/TFT_espi
	# Accept new functionality in a backwards compatible manner and patches
  	;xreef/SimpleFTPServer @ ^2.1.8	
	;https://github.com/joltwallet/esp_full_miniz.git
lib_ignore = MIDIUSB
;lib_archive = no

[env:dev]	; dev uses the JTAG for serial mon/upload by default, nothing to do
extra_scripts = 
	pre:prescript.py
	post:gzfw_to_data.py
	post:make_tgz.py
;monitor_filters = esp32_exception_decoder
;build_type = debug
build_flags = 
	-D DEBUG
	;-D CORE_DEBUG_LEVEL=5
	!python git_rev_macro.py
	;-Wformat						; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash
	;-Werror=format					; empeche la compilation en DETECTANT LES DEBUG_PRINT qui crash

[env:prod]
build_type = release
extra_scripts = 
	pre:prescript.py
build_flags = 
	-D PROD=1
	;-DCORE_DEBUG_LEVEL=0
	; Active le stack USB OTG (TinyUSB) et coupe le CDC/JTAG du core afin de pouvoir utiliser l'USB MIDI
	-DARDUINO_USB_MODE=0	
	-DARDUINO_USB_CDC_ON_BOOT=0	
	!python git_rev_macro.py
