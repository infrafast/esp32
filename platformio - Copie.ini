; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
; board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson
	jonblack/arduino-menusystem
	tobozo/ESP32-targz
	Bodmer/TJpg_Decoder
	arduino-libraries/Ethernet@^2.0.2
	links2004/WebSockets@^2.4.1
	cnmat/OSC@^1.0.0
	amcewen/HttpClient@^2.2.0
	mbed-seeed/BluetoothSerial@0.0.0+sha.f56002898ee8
	lasselukkari/aWOT@^3.5.0
	bodmer/JPEGDecoder@^2.0.0
	ivanseidel/LinkedList@0.0.0-alpha+sha.dac3874d28
	https://github.com/skaarj1989/mWebSockets#meta
	https://github.com/andrew-susanto/Arduino-Ethernet-Icmp.git
	marian-craciunescu/ESP32Ping@^1.7
	arduino-libraries/Ethernet@^2.0.2
	;arduino-libraries/ArduinoMDNS@^1.0.0

[env:dev]
;build_type = debug
extra_scripts = pre:prescript.py
build_flags = 
	-D DEBUG=1
	-D ICMPPING_ASYNCH_ENABLE
;	-D DEBUG_ESP_PORT=Serial	
;	-D DEBUG_ESP_WIFI 
	;-DDEBUG_ESP_HTTP_SERVER
	;-DDEBUG_ESP_HTTP_CLIENT
;	-D DEBUG_ESP_CORE
	;-DDEBUG_ESP_HTTP_UPDATE
	;-DDEBUG_ESP_UPDATER
	;-DDEBUG_ESP_OTA	

[env:prod]
extra_scripts = pre:prescript.py
build_flags = -D ICMPPING_ASYNCH_ENABLE
